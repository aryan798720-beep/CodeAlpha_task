
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>
</head>
<link rel="stylesheet" href="style.css">
<body>

<h1>My Image Gallery</h1>

<div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="nature">Nature</button>
    <button data-filter="city">City</button>
    <button data-filter="animals">Animals</button>
</div>

<div class="gallery">

    <div class="photo" data-category="nature">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Mountains">
        <div class="caption">Beautiful Mountains</div>
    </div>

    <div class="photo" data-category="city">
        <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=800&q=80" alt="City">
        <div class="caption">City Lights</div>
    </div>

    <div class="photo" data-category="animals">
        <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=800&q=80" alt="Dog">
        <div class="caption">Cute Dog</div>
    </div>

    <div class="photo" data-category="nature">
        <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80" alt="Forest">
        <div class="caption">Green Forest</div>
    </div>

    <div class="photo" data-category="city">
        <img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=800&q=80" alt="Buildings">
        <div class="caption">Modern City</div>
    </div>

    <div class="photo" data-category="nature">
        <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=800&q=80" alt="Ocean">
        <div class="caption">Blue Ocean</div>
    </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <button class="lb-btn close" id="closeBtn">X</button>
    <button class="lb-btn prev" id="prevBtn">&#10094;</button>
    <img id="lightboxImg" src="" alt="Selected image">
    <button class="lb-btn next" id="nextBtn">&#10095;</button>
</div>

</body>
<script src="javascript.js"></script>  
</html>
