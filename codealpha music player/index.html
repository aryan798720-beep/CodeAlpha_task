
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="music-player">
        <h1>Music Player</h1>
        <p class="subtitle">Your music, your mood.</p>

        <div class="album-art">
            <div class="disc">
                <span>♫</span>
            </div>
        </div>

        <div class="song-info">
            <h2 id="song-title">Loading Song...</h2>
            <p id="song-artist">Artist</p>
        </div>

        <audio id="audio"></audio>

        <div class="progress-container">
            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
                aria-label="Song progress"
            >

            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button id="prev" aria-label="Previous song">⏮</button>
            <button id="play" class="play-btn" aria-label="Play music">▶</button>
            <button id="next" aria-label="Next song">⏭</button>
        </div>

        <div class="volume-container">
            <label for="volume">🔊 Volume</label>
            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.7"
            >
        </div>

        <div class="playlist-header">
            <h3>My Playlist</h3>
            <label class="autoplay-label">
                <input type="checkbox" id="autoplay" checked>
                Autoplay
            </label>
        </div>

        <ul id="playlist"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
